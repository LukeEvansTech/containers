---
name: Build and Push Containers

on:
  push:
    branches:
      - main
    paths:
      - 'apps/**'
      - '.github/workflows/build-and-push.yaml'
  pull_request:
    paths:
      - 'apps/**'
  workflow_dispatch:
    inputs:
      app:
        description: 'App to build (leave empty for all changed apps)'
        required: false
        type: string

env:
  REGISTRY: ghcr.io

jobs:
  detect-changes:
    name: Detect Changed Apps
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.set-matrix.outputs.apps }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Detect changed apps
        id: changed-files
        uses: tj-actions/changed-files@a284dc1814e3fd07f2e34267fc8f81227ed29fb8 # v45.0.9
        with:
          files: apps/**
          dir_names: true
          dir_names_max_depth: 2

      - name: Set matrix
        id: set-matrix
        run: |
          if [ -n "${{ inputs.app }}" ]; then
            # Manual trigger with specific app
            echo "apps=[\"${{ inputs.app }}\"]" >> $GITHUB_OUTPUT
          elif [ "${{ steps.changed-files.outputs.any_changed }}" == "true" ]; then
            # Auto-detect changed apps. scan("\\S+") tokenises on ANY whitespace and drops the
            # trailing newline from the slurped output — `split(" ")` left a trailing \n on the last
            # app name (e.g. "logstash-sentinel\n"), which broke the per-app VERSION lookup and the
            # version image tag (only `latest`/`main-<sha>` got pushed, never `:<version>`).
            APPS=$(echo '${{ steps.changed-files.outputs.all_changed_files }}' | jq -R -s -c '[scan("\\S+") | split("/")[1]] | unique')
            echo "apps=${APPS}" >> $GITHUB_OUTPUT
          else
            # No changes
            echo "apps=[]" >> $GITHUB_OUTPUT
          fi

      - name: Show apps to build
        run: |
          echo "Apps to build: ${{ steps.set-matrix.outputs.apps }}"

  build:
    name: Build ${{ matrix.app }}
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.apps != '[]'
    strategy:
      matrix:
        app: ${{ fromJson(needs.detect-changes.outputs.apps) }}
      fail-fast: false
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read VERSION file and prepare build args
        id: version
        run: |
          if [ -f "apps/${{ matrix.app }}/VERSION" ]; then
            VERSION=$(cat apps/${{ matrix.app }}/VERSION)
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "has_version=true" >> $GITHUB_OUTPUT
            echo "Found VERSION file with version: $VERSION"

            # Create build arg with uppercase app name
            APP_UPPER=$(echo "${{ matrix.app }}" | tr '[:lower:]' '[:upper:]' | tr '-' '_')
            BUILD_ARG="${APP_UPPER}_VERSION=${VERSION}"
            echo "build_arg=$BUILD_ARG" >> $GITHUB_OUTPUT
            echo "Build arg: $BUILD_ARG"
          else
            echo "has_version=false" >> $GITHUB_OUTPUT
            echo "build_arg=" >> $GITHUB_OUTPUT
            echo "No VERSION file found"
          fi

          # Always add CACHEBUST to force rebuild when needed
          echo "cachebust=${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.app }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix={{branch}}-
            type=ref,event=pr
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ steps.version.outputs.has_version == 'true' }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ./apps/${{ matrix.app }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            ${{ steps.version.outputs.build_arg }}
            CACHEBUST=${{ steps.version.outputs.cachebust }}
          no-cache: true

      - name: Generate artifact attestation
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-name: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.app }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Summary
        run: |
          echo "## Built: ${{ matrix.app }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image**: \`${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.app }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Digest**: \`${{ steps.build.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Tags" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

  status:
    name: Build Status
    runs-on: ubuntu-latest
    needs: build
    if: always()
    steps:
      - name: Check build status
        run: |
          if [ "${{ needs.build.result }}" == "failure" ]; then
            echo "❌ Some builds failed"
            exit 1
          elif [ "${{ needs.build.result }}" == "skipped" ]; then
            echo "⏭️ No apps to build"
          else
            echo "✅ All builds succeeded"
          fi
