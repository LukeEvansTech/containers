---
name: Build and Push Containers

on:
  push:
    branches:
      - main
    paths:
      - "apps/**"
      - ".github/workflows/build-and-push.yaml"
  pull_request:
    paths:
      - "apps/**"
  workflow_dispatch:
    inputs:
      app:
        description: "App to build (leave empty for all changed apps)"
        required: false
        type: string

env:
  REGISTRY: ghcr.io

# Read-only by default; the build job elevates its own scopes below.
permissions:
  contents: read

jobs:
  detect-changes:
    name: Detect Changed Apps
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.set-matrix.outputs.apps }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect changed apps
        id: changed-files
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files: apps/**
          dir_names: true
          dir_names_max_depth: 2

      - name: Set matrix
        id: set-matrix
        run: |
          if [ -n "${INPUT_APP}" ]; then
            # Manual trigger with specific app
            echo "apps=[\"${INPUT_APP}\"]" >> "$GITHUB_OUTPUT"
          elif [ "${ANY_CHANGED}" == "true" ]; then
            # Auto-detect changed apps. scan("\\S+") tokenises on ANY whitespace and drops the
            # trailing newline from the slurped output — `split(" ")` left a trailing \n on the last
            # app name (e.g. "logstash-sentinel\n"), which broke the per-app VERSION lookup and the
            # version image tag (only `latest`/`main-<sha>` got pushed, never `:<version>`).
            # select(test(...)) allowlists app names to [A-Za-z0-9_-] so nothing
            # path-like or shell-meta can ever reach the build matrix (defence in
            # depth for the matrix.app interpolations downstream).
            APPS=$(echo "${ALL_CHANGED_FILES}" | jq -R -s -c '[scan("\\S+") | split("/")[1] | select(test("^[A-Za-z0-9_-]+$"))] | unique')
            echo "apps=${APPS}" >> "$GITHUB_OUTPUT"
          else
            # No changes
            echo "apps=[]" >> "$GITHUB_OUTPUT"
          fi
        env:
          INPUT_APP: ${{ inputs.app }}
          ANY_CHANGED: ${{ steps.changed-files.outputs.any_changed }}
          ALL_CHANGED_FILES: ${{ steps.changed-files.outputs.all_changed_files }}

      - name: Show apps to build
        run: |
          echo "Apps to build: ${APPS}"
        env:
          APPS: ${{ steps.set-matrix.outputs.apps }}

  build:
    name: Build ${{ matrix.app }}
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.apps != '[]'
    strategy:
      matrix:
        app: ${{ fromJson(needs.detect-changes.outputs.apps) }}
      fail-fast: false
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read VERSION file and prepare build args
        id: version
        run: |
          if [ -f "apps/${MATRIX_APP}/VERSION" ]; then
            VERSION=$(cat "apps/${MATRIX_APP}/VERSION")
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "has_version=true" >> "$GITHUB_OUTPUT"
            echo "Found VERSION file with version: $VERSION"

            # Create build arg with uppercase app name
            APP_UPPER=$(echo "${MATRIX_APP}" | tr '[:lower:]' '[:upper:]' | tr '-' '_')
            BUILD_ARG="${APP_UPPER}_VERSION=${VERSION}"
            echo "build_arg=$BUILD_ARG" >> "$GITHUB_OUTPUT"
            echo "Build arg: $BUILD_ARG"
          else
            echo "has_version=false" >> "$GITHUB_OUTPUT"
            echo "build_arg=" >> "$GITHUB_OUTPUT"
            echo "No VERSION file found"
          fi

          # Always add CACHEBUST to force rebuild when needed
          echo "cachebust=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
        env:
          MATRIX_APP: ${{ matrix.app }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.app }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            # {{branch}} resolves EMPTY on pull_request events, so this produced the
            # tag "-<sha>" (e.g. "brother-deployer:-bc366df"), which docker rejects:
            # 'invalid tag ... invalid reference format'. Every app's build failed on
            # every PR, so no Renovate PR in this repo could ever go green.
            # Gated to non-PR events only. PRs still get a valid tag from
            # type=ref,event=pr below, and push is false on PRs anyway, so the tag is
            # only used for the local build. Pushed tags on main are unchanged.
            type=sha,prefix={{branch}}-,enable=${{ github.event_name != 'pull_request' }}
            type=ref,event=pr
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ steps.version.outputs.has_version == 'true' }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          # matrix.app is allowlist-filtered to [A-Za-z0-9_-] in Set matrix, and
          # build-push-action passes context via exec arg arrays (no shell). A
          # fork PR could edit the Dockerfile being built anyway, so template
          # expansion here adds no attacker capability.
          context: ./apps/${{ matrix.app }} # zizmor: ignore[template-injection]
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            ${{ steps.version.outputs.build_arg }}
            CACHEBUST=${{ steps.version.outputs.cachebust }}
          no-cache: true

      - name: Generate artifact attestation
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.app }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Summary
        run: |
          {
            echo "## Built: ${MATRIX_APP}"
            echo ""
            echo "**Image**: \`${REGISTRY}/${GITHUB_REPOSITORY_OWNER}/${MATRIX_APP}\`"
            echo "**Digest**: \`${DIGEST}\`"
            echo ""
            echo "### Tags"
            echo '```'
            echo "${TAGS}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          MATRIX_APP: ${{ matrix.app }}
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}

  status:
    name: Build Status
    runs-on: ubuntu-latest
    needs: build
    if: always()
    steps:
      - name: Check build status
        run: |
          if [ "${BUILD_RESULT}" == "failure" ]; then
            echo "❌ Some builds failed"
            exit 1
          elif [ "${BUILD_RESULT}" == "skipped" ]; then
            echo "⏭️ No apps to build"
          else
            echo "✅ All builds succeeded"
          fi
        env:
          BUILD_RESULT: ${{ needs.build.result }}
