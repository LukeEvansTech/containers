---
name: Lint
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lint:
    permissions:
      contents: read
      statuses: write
      pull-requests: write
    uses: LukeEvansTech/shared-workflows/.github/workflows/super-linter.yml@4a27af481a70705a65b82c72ef62fc58c5af6ed0 # v1
    with:
      # Blocking from day one, not soft-launch: Renovate self-gates on this
      # repo's statuses (ignoreTests: false), and with soft-launch the per-linter
      # commit statuses can fail while the visible lint job stays green —
      # silently wedging every Renovate PR. Findings were fixed in the PR that
      # introduced this workflow (verified locally with hadolint/actionlint/zizmor),
      # so there is nothing to soft-launch around.
      soft-launch: false
