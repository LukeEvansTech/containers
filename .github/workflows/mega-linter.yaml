# MegaLinter GitHub Action
# https://megalinter.io/latest/

name: MegaLinter

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Cancel in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  pull-requests: write
  statuses: write

jobs:
  megalinter:
    name: MegaLinter
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0  # Full git history for better analysis

      - name: MegaLinter
        id: ml
        uses: oxsecurity/megalinter@ef3e84b8b836d76db562d0f3ed7da61e8fd538bc # v9.6.0
        env:
          VALIDATE_ALL_CODEBASE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Override settings for CI
          APPLY_FIXES: none
          DISABLE_ERRORS: false

      # Upload reports as artifacts
      - name: Archive linting reports
        if: success() || failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: MegaLinter-reports
          path: |
            megalinter-reports
            mega-linter.log
          retention-days: 7

      # Add PR comment with summary (only on PRs)
      - name: Create PR comment
        if: github.event_name == 'pull_request' && (success() || failure())
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const fs = require('fs');
            const reportPath = 'megalinter-reports/megalinter-report.txt';

            if (!fs.existsSync(reportPath)) {
              console.log('No report file found');
              return;
            }

            const report = fs.readFileSync(reportPath, 'utf8');
            const status = '${{ steps.ml.outcome }}' === 'success' ? '✅' : '❌';

            // Truncate if too long
            const maxLength = 65000;
            const truncatedReport = report.length > maxLength
              ? report.substring(0, maxLength) + '\n\n... (truncated)'
              : report;

            const body = `## ${status} MegaLinter Report

            <details>
            <summary>Click to expand full report</summary>

            \`\`\`
            ${truncatedReport}
            \`\`\`

            </details>

            📊 Full reports available in [workflow artifacts](${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID})
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
